<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Private Chat Interface">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Add Markdown and LaTeX libraries with global declaration -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script>
    // Make renderMathInElement globally available
    window.renderMathInElement = renderMathInElement;
  </script>

  <title>Private Chat</title>
  <link href="/src/styles.css" rel="stylesheet" type="text/css" />
  <link href="/src/llm_chat.css" rel="stylesheet" type="text/css" />
  <style>
    .app-name {
      font-size: 12px; /* Reduced from 14px */
      color: #666;
      font-weight: 500;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    
    .chatui-select-wrapper {
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px; /* Reduced from 10px */
      min-height: 36px; /* Add explicit minimal height */
    }
  </style>
</head>
<body>
  <!-- Sidebar overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>Private Chat</h3>
      <button id="sidebar-close" aria-label="Close menu">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="sidebar-content">
      <div class="sidebar-section">

        <button id="sidebar-reset-btn" class=" hidden" aria-label="Reset conversation">
          <i data-lucide="eraser"></i> Reset Conversation
        </button>
      </div>
      <div class="sidebar-section">
        <h4>Chat Sessions</h4>
        <ul id="chat-session-list">
          <!-- Sessions will be dynamically populated -->
        </ul>
      </div>
    </div>
  </aside>

  <main class="chatui">
    
    <div class="chatui-select-wrapper">
      <div class="header-left">
        <button id="menu-btn" class="menu-btn" aria-label="Open menu">
          <i data-lucide="menu"></i>
        </button>
        <button id="chatui-new-chat-btn" class="new-chat-btn" title="Start new chat">
          <i data-lucide="plus"></i>
        </button>
      </div>
      
      <span class="app-name">Private Chat</span>
      
      <button id="chatui-reset-btn" class="chatui-reset-btn" aria-label="Reset conversation"> 
        <i data-lucide="eraser"></i>
      </button>
    </div>
    <div class="chatui-chat" id="chatui-chat"></div>
    <label id="chatui-info-label" aria-live="polite" class="hidden"> </label>

    <div class="chatui-inputarea">
      <input
        id="chatui-input"
        type="text"
        class="chatui-input"
        placeholder="Enter your message..."
        aria-label="Message input"
      />
      <button id="chatui-send-btn" class="chatui-send-btn" aria-label="Send message"> 
        <i data-lucide="send"></i>
      </button>
    </div>
  </main>

  <div class="chatui-extra-control">
    <label id="chatui-info-label" aria-live="polite"></label>
  </div>
  
  <script>
    // Initialize Lucide icons
    lucide.createIcons();
    
    // Setup sidebar functionality
    document.addEventListener('DOMContentLoaded', () => {
      const menuBtn = document.getElementById('menu-btn');
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebar-overlay');
      const sidebarClose = document.getElementById('sidebar-close');
      const sidebarResetBtn = document.getElementById('sidebar-reset-btn');
      const mainResetBtn = document.getElementById('chatui-reset-btn');
      
      // Function to open sidebar
      const openSidebar = () => {
        sidebar.classList.add('open');
        sidebarOverlay.classList.add('visible');
        document.body.classList.add('sidebar-active');
      };
      
      // Function to close sidebar
      const closeSidebar = () => {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('visible');
        document.body.classList.remove('sidebar-active');
      };
      
      menuBtn.addEventListener('click', openSidebar);
      sidebarClose.addEventListener('click', closeSidebar);
      sidebarOverlay.addEventListener('click', closeSidebar);
      
      // Make the sidebar reset button work
      sidebarResetBtn.addEventListener('click', () => {
        mainResetBtn.click();
        closeSidebar();
      });
    });
  </script>
  
  <!-- Place script after UI to ensure DOM elements are loaded first -->
  <script type="module" src="/src/simple_chat.ts"></script>
</body>
</html>
